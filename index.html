<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="google-site-verification" content="4raGqpOeJTb8aMl00P_4J94hDLzErMn5hDGFZcOV5uI" />
    <meta name="theme-color" content="#0e0e10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Not black-translucent: iOS 26 home-screen apps then make the viewport status-bar-height short at the bottom
         (empty band under the tab bar, anything moved into it is clipped). With "black" it starts below the bar. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>OpenSISAKHK</title>
    <script>
      // Splash in the app's style and theme from the first frame: the saved choices (Settings), else "Nový" and the system's.
      (function () {
        var t = "system";
        var ui = "new";
        try {
          t = JSON.parse(localStorage.getItem("osis:theme")) || "system";
          ui = JSON.parse(localStorage.getItem("osis:ui")) || "new";
        } catch (e) {}
        var light = t === "light" || (t === "system" && !matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.setAttribute("data-ui", ui);
        if (light) root.classList.add("sp-light");
        var bar = ui === "new" ? (light ? "#b38a64" : "#2a2522") : light ? "#f6f3ee" : "#0e0e10";
        document.querySelector('meta[name="theme-color"]').setAttribute("content", bar);
      })();
    </script>
    <!-- Splash lives here, not in React, so it paints on the very first frame. main.tsx hides it. -->
    <style>
      html, body { margin: 0; background: #0e0e10; }
      .sp-light, .sp-light body, .sp-light #splash { background: #f6f3ee; }
      .sp-light .sp-open-text { color: #0e0e10; }
      .sp-light .sp-note { color: rgba(14, 14, 16, 0.7); }
      .sp-light .sp-version { color: rgba(14, 14, 16, 0.4); }
      #splash {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #0e0e10;
        transition: opacity 380ms ease, transform 520ms cubic-bezier(0.32, 0.72, 0, 1);
        animation: sp-fallback 300ms ease 5s forwards; /* if the app never boots, don't trap the user */
      }
      #splash.hide { opacity: 0; transform: scale(1.06); pointer-events: none; visibility: hidden; transition: opacity 380ms ease, transform 520ms cubic-bezier(0.32, 0.72, 0, 1), visibility 0s 520ms; }
      /* Shown again over the running app while an update reloads it. */
      #splash.again { animation: none; transition: opacity 200ms ease; }
      .sp-note, .sp-version { position: absolute; left: 0; right: 0; margin: 0; text-align: center; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .sp-note { top: calc(50% + 3rem); font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(246, 243, 238, 0.7); opacity: 0; transition: opacity 200ms ease; }
      #splash.note .sp-note, #splash.again .sp-note { opacity: 1; }
      /* Under "Aktualizace": an ember segment sweeping along a hairline track, so the wait reads as work in progress. */
      .sp-bar { position: absolute; left: 50%; top: calc(50% + 4.75rem); width: 88px; height: 3px; margin-left: -44px; border-radius: 2px; overflow: hidden; background: rgba(246, 243, 238, 0.12); opacity: 0; transition: opacity 240ms ease 120ms; }
      .sp-light .sp-bar { background: rgba(14, 14, 16, 0.1); }
      .sp-bar i { position: absolute; top: 0; bottom: 0; left: 0; width: 40%; border-radius: 2px; background: #ff5a1f; animation: sp-bar 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
      #splash.note .sp-bar, #splash.again .sp-bar { opacity: 1; }
      @keyframes sp-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      .sp-version { bottom: calc(env(safe-area-inset-bottom) + 24px); font-size: 0.75rem; color: rgba(246, 243, 238, 0.35); }
      .sp-mark { display: flex; align-items: baseline; font: 800 clamp(2.4rem, 11vw, 3.4rem) / 1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; letter-spacing: -0.03em; }
      .sp-sis { color: #ff5a1f; opacity: 0; transform: scale(0.9); animation: sp-in 520ms cubic-bezier(0.32, 0.72, 0, 1) 80ms forwards; }
      /* "Open" makes room by growing its column from 0 while sliding in from the left: SISAKHK glides right to stay centred. */
      .sp-open { display: grid; grid-template-columns: 0fr; animation: sp-grow 720ms cubic-bezier(0.32, 0.72, 0, 1) 520ms forwards; }
      .sp-open > span { overflow: hidden; min-width: 0; }
      .sp-open-text { display: inline-block; font-weight: 300; color: #f6f3ee; padding-right: 0.02em; transform: translateX(-105%); animation: sp-slide 720ms cubic-bezier(0.32, 0.72, 0, 1) 520ms forwards; }
      @keyframes sp-in { to { opacity: 1; transform: none; } }
      @keyframes sp-grow { to { grid-template-columns: 1fr; } }
      @keyframes sp-slide { to { transform: none; } }
      @keyframes sp-fallback { to { opacity: 0; visibility: hidden; } }
      /* Styl "Nový": the app's wallpaper (dimmed in dark mode), the update bar in its blue. Same marks and motion. */
      [data-ui="new"] body, [data-ui="new"] #splash {
        background:
          linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
          radial-gradient(60% 40% at 10% 8%, rgb(214, 160, 92) 0%, rgba(214, 160, 92, 0) 100%),
          radial-gradient(55% 35% at 95% 30%, rgb(120, 86, 64) 0%, rgba(120, 86, 64, 0) 100%),
          radial-gradient(60% 40% at 90% 85%, rgb(96, 110, 140) 0%, rgba(96, 110, 140, 0) 100%),
          linear-gradient(165deg, rgb(168, 128, 92), rgb(206, 196, 184) 50%, rgb(120, 118, 138));
      }
      [data-ui="new"].sp-light body, [data-ui="new"].sp-light #splash {
        background:
          radial-gradient(60% 40% at 10% 8%, rgb(214, 160, 92) 0%, rgba(214, 160, 92, 0) 100%),
          radial-gradient(55% 35% at 95% 30%, rgb(120, 86, 64) 0%, rgba(120, 86, 64, 0) 100%),
          radial-gradient(60% 40% at 90% 85%, rgb(96, 110, 140) 0%, rgba(96, 110, 140, 0) 100%),
          linear-gradient(165deg, rgb(168, 128, 92), rgb(206, 196, 184) 50%, rgb(120, 118, 138));
      }
      [data-ui="new"] .sp-open-text { color: #ffffff; }
      [data-ui="new"].sp-light .sp-open-text { color: #000000; }
      [data-ui="new"] .sp-note { color: rgba(235, 235, 245, 0.7); }
      [data-ui="new"].sp-light .sp-note { color: rgba(60, 60, 67, 0.75); }
      [data-ui="new"] .sp-version { color: rgba(235, 235, 245, 0.45); }
      [data-ui="new"].sp-light .sp-version { color: rgba(60, 60, 67, 0.5); }
      [data-ui="new"] .sp-bar { background: rgba(118, 118, 128, 0.36); }
      [data-ui="new"].sp-light .sp-bar { background: rgba(118, 118, 128, 0.2); }
      [data-ui="new"] .sp-bar i { background: #0091ff; }
      [data-ui="new"].sp-light .sp-bar i { background: #0088ff; }
      @media (prefers-reduced-motion: reduce) {
        .sp-sis, .sp-open, .sp-open-text { animation: none; opacity: 1; transform: none; grid-template-columns: 1fr; }
        .sp-bar i { width: 100%; animation: sp-glow 1.6s ease-in-out infinite alternate; }
        @keyframes sp-glow { from { opacity: 0.35; } to { opacity: 1; } }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="sp-mark">
        <span class="sp-open"><span><span class="sp-open-text">Open</span></span></span><span class="sp-sis">SISAKHK</span>
      </div>
      <p class="sp-note">Aktualizace</p>
      <div class="sp-bar"><i></i></div>
      <p class="sp-version">verze %APP_VERSION%</p>
    </div>
    <script>
      // main.tsx sets this right before reloading into a new version.
      try {
        if (sessionStorage.getItem("osis:updating")) {
          sessionStorage.removeItem("osis:updating");
          document.getElementById("splash").classList.add("note");
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
