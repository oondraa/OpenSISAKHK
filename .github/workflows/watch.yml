# Checks grades, absences and the personal timetable of students who switched it on and pushes what's new
# (scripts/watch.ts). Woken by the Worker's cron (src/worker/index.ts): every 10 minutes 6:00–22:30 Prague time
# ("tick"), and right away when the school timetable changes, also at night ("school-changed"). GitHub throttles
# its own schedule to a run every few hours, so the schedule below is only a fallback for when the Worker can't.
name: Grades, absence and timetable

on:
  repository_dispatch:
    types: [school-changed, tick]
  schedule:
    - cron: "*/30 4-20 * * *"
  workflow_dispatch:

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/watch.ts
        env:
          API_URL: ${{ secrets.API_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_JWK: ${{ secrets.VAPID_PRIVATE_JWK }}
